services:
  app:
    build:
      context: .
      target: dev
      network: host
    command: sh -c "yarn db:push && yarn dev"
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@host.docker.internal:5433/sara
      AUTH_SECRET: local-development-auth-secret-change-me
      AUTH_DISCORD_ID: local-development-discord-id
      AUTH_DISCORD_SECRET: local-development-discord-secret
      NEXTAUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      ATLAS_API_URL: http://atlas:3001
      WATCHPACK_POLLING: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
      - app_next:/app/.next
      - app_generated:/app/generated
    depends_on:
      atlas:
        condition: service_started
    restart: unless-stopped

  atlas:
    build:
      context: ./atlas
    ports:
      - "3001:3001"
    environment:
      ATLAS_TILE_SOURCE: local
      ATLAS_TILE_DIR: /data/tiles
      ATLAS_OSM_DIR: /data/osm
      ATLAS_GEOCODE_INDEX_DIR: /data/indices/geocode-index
      ATLAS_SEARCH_INDEX_DIR: /data/indices/search-index
      ATLAS_ROUTE_DIR: /data/indices
      ATLAS_LANDMARK_PATH: /data/indices/landmarks.bin
      ATLAS_PLACES_PATH: /data/indices/places.bin
      ATLAS_SPEED_DATA_PATH: /data/indices/speed_data.bin
      ATLAS_CONTRIBUTIONS_DIR: /data/contributions
      ATLAS_TELEMETRY_DIR: /data/telemetry
      ATLAS_PORT: 3001
      ATLAS_AUTH_ENABLED: "false"
      RUST_LOG: info
    volumes:
      - atlas_osm:/data/osm
      - atlas_tiles:/data/tiles
      - atlas_indices:/data/indices
      - atlas_contributions:/data/contributions
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      start_period: 900s
      retries: 30
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    profiles:
      - production
    environment:
      POSTGRES_DB: sara
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sara"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  app_node_modules:
  app_next:
  app_generated:
  postgres_data:
  atlas_osm:
  atlas_tiles:
  atlas_indices:
  atlas_contributions:

