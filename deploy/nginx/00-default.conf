# Catch-all for the bare IP and any unrecognised Host header.
#
# Oracle Linux's stock /etc/nginx/nginx.conf ships a `listen 80;` block (note:
# no `default_server`) serving /usr/share/nginx/html. Claiming default_server
# here makes that block unreachable without editing a distro-owned file: its
# `server_name _` never matches a real Host, so it was only ever reachable as
# the default server.
#
# 444 closes the connection with no response, so the host does not advertise
# what it runs to anyone scanning the IP.
server {
    listen      80 default_server;
    listen      [::]:80 default_server;
    server_name _;
    return      444;
}

