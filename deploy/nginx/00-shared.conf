# Shared http-context helpers for every app vhost on this host.
#
# Declared exactly once, rather than rendered into each vhost the way strive's
# single-app nginx.conf declares it inline. nginx does NOT reject a duplicate
# `map` for the same variable — map declares its variable changeable, so a
# second definition silently redefines it (verified on nginx 1.20.1 with both
# identical and differing bodies). Silent redefinition is the reason to hoist
# it: N rendered copies would drift without ever failing `nginx -t`.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

